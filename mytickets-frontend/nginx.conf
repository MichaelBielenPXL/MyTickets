# The site and its API on one address: pages from here, /api passed on to the API container. One address keeps
# the sign-in cookie a first-party cookie, which Safari and iPhones require.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Logos and event pictures are uploaded through /api, up to 4 MB.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep https as the visitor saw it, from the proxy in front (Coolify's, Cloudflare).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }

    # Built files carry a hash in their name: they never change, so browsers may keep them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other address is a page of the app: let React's router show it.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
