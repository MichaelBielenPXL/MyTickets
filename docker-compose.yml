# MyTickets, all of it: the site (web), the API, Redis (cache) and RustFS (uploaded pictures).
# One compose, so one deployment always ships the site and the API from the same commit.
#
# Coolify: add this repository as a "Docker Compose" resource (compose file /docker-compose.yml). The domain goes on
# the web service; nothing else is reachable from outside. Set PUBLIC_URL and STORAGE_SECRET_KEY under Environment
# Variables. See deploy/README.md.
#
# Without Coolify: docker compose --env-file deploy/.env up -d --build, plus a port on web (see deploy/README.md).

services:
  web:
    build: ./mytickets-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Tells Coolify to route this service's domain to port 80. Ignored elsewhere.
      SERVICE_FQDN_WEB_80: ""

  api:
    build:
      context: ./mytickets-backend
      dockerfile: MyTickets.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - storage
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8001"
      # The site's address (the web service's domain): card links, Stripe's return pages and wallet passes point there.
      App__PublicUrl: ${PUBLIC_URL:?Set PUBLIC_URL to the site's address}
      # Cloudflare hands over the visitor's own address in this header, whatever proxies follow it.
      Proxy__ClientIpHeader: CF-Connecting-IP
      ConnectionStrings__cache: redis:6379
      Storage__Endpoint: http://storage:9000
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:-mytickets}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY}
      # Without Stripe keys there is the test checkout, where no money moves. Live: false, with Stripe keys.
      Payments__UseTestCheckout: ${USE_TEST_CHECKOUT:-true}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - api-data:/data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  storage:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-mytickets}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY}
    volumes:
      - pictures:/data

volumes:
  api-data:
  pictures:
