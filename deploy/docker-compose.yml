# MyTickets API on a server: the API, Redis (cache) and RustFS (uploaded pictures). The API listens on port 8001;
# a Cloudflare Tunnel on the server publishes it as API_DOMAIN with https.
# The site itself runs on Vercel and forwards /api to that domain (see mytickets-frontend/middleware.ts).
#
# On the server, next to a checkout of the repository:
#   cp deploy/.env.dev.example deploy/.env     # then fill in the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# The same file serves the live API: use deploy/.env.live.example instead.
name: mytickets-${STAGE:-dev}

services:
  api:
    build:
      context: ../mytickets-backend
      dockerfile: MyTickets.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - storage
    # Only on this server by default, so the API is reached through the tunnel and nothing else. cloudflared in a
    # container instead? Set API_BIND=0.0.0.0, or put cloudflared on this compose network and use http://api:8001.
    ports:
      - "${API_BIND:-127.0.0.1}:8001:8001"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8001"
      # The site's own address (Vercel): card links, Stripe's return pages and wallet passes point there.
      App__PublicUrl: ${PUBLIC_URL:?Set PUBLIC_URL to the site's address}
      # Vercel, then Cloudflare: the visitor's own address is two hops back.
      Proxy__ForwardedHops: "2"
      ConnectionStrings__cache: redis:6379
      Storage__Endpoint: http://storage:9000
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:-mytickets}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY}
      # Without Stripe keys there is the test checkout, where no money moves. Live: false, with Stripe keys.
      Payments__UseTestCheckout: ${USE_TEST_CHECKOUT:-true}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - api-data:/data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  storage:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-mytickets}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY}
    volumes:
      - pictures:/data

volumes:
  api-data:
  pictures:
